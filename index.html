<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TradeReplay — NSE/BSE Practice Simulator</title>
  <meta name="description" content="Practice trading on real NSE/BSE historical data. Replay candles, zoom & pan like TradingView.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    :root{
      --bg:#0d0f0e;--bg2:#141714;--bg3:#1b1f1b;--bg4:#222622;
      --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
      --text:#e8ece8;--text2:#8a9489;--text3:#5a6359;
      --green:#22c97a;--green2:#166642;--green3:#0d3d26;
      --red:#f04f4f;--red2:#6b2020;--red3:#3d1212;
      --amber:#e8a020;
      --font-d:'Syne',sans-serif;--font-m:'DM Mono',monospace;
      --r:6px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-m);font-size:13px;line-height:1.5;overflow:hidden;}
    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:4px;}
    #app{display:flex;flex-direction:column;height:100vh;}

    .topbar{display:flex;align-items:center;gap:14px;padding:0 18px;height:50px;border-bottom:1px solid var(--border);background:var(--bg);flex-shrink:0;}
    .brand{font-family:var(--font-d);font-size:17px;font-weight:700;letter-spacing:-0.5px;white-space:nowrap;}
    .brand em{color:var(--green);font-style:normal;}
    .sep{width:1px;height:18px;background:var(--border);flex-shrink:0;}
    .instr-sel{font-family:var(--font-m);font-size:13px;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:5px 9px;border-radius:var(--r);cursor:pointer;outline:none;}
    .instr-sel:hover{border-color:var(--border2);}
    .tf-btns{display:flex;gap:3px;}
    .tf-btn{font-family:var(--font-m);font-size:11px;font-weight:500;padding:4px 9px;border-radius:var(--r);border:1px solid var(--border);background:transparent;color:var(--text3);cursor:pointer;transition:all .15s;}
    .tf-btn:hover{color:var(--text2);border-color:var(--border2);}
    .tf-btn.active{background:var(--green3);color:var(--green);border-color:var(--green2);}
    .badge{font-size:10px;font-weight:500;padding:3px 9px;border-radius:20px;white-space:nowrap;}
    .badge-live{background:var(--green3);color:var(--green);border:1px solid var(--green2);}
    .badge-sim{background:var(--bg3);color:var(--text3);border:1px solid var(--border);}
    .badge-loading{background:#2a2000;color:var(--amber);border:1px solid #4a3800;}
    .badge-error{background:var(--red3);color:var(--red);border:1px solid var(--red2);}
    .session-date{margin-left:auto;font-size:11px;color:var(--text3);white-space:nowrap;}

    .prog-bar{height:2px;background:var(--bg3);flex-shrink:0;}
    .prog-fill{height:100%;background:var(--green);transition:width .08s linear;width:0%;}

    .main{display:flex;flex:1;overflow:hidden;}
    .chart-area{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden;}

    .price-header{display:flex;align-items:baseline;gap:14px;padding:9px 18px 5px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
    .price-symbol{font-family:var(--font-d);font-size:13px;color:var(--text2);}
    .price-ltp{font-family:var(--font-d);font-size:25px;font-weight:700;}
    .price-chg{font-size:13px;font-weight:500;}
    .price-chg.up{color:var(--green);}
    .price-chg.dn{color:var(--red);}
    .ohlc{display:flex;gap:18px;padding:4px 18px 7px;font-size:11px;color:var(--text3);}
    .ohlc span b{color:var(--text2);font-weight:500;}

    .candle-wrap{flex:1;position:relative;overflow:hidden;cursor:crosshair;user-select:none;}
    #chartCanvas{position:absolute;top:0;left:0;display:block;}

    .ch-tooltip{position:absolute;pointer-events:none;display:none;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r);padding:6px 10px;font-size:11px;color:var(--text);white-space:nowrap;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.5);}

    .controls{display:flex;align-items:center;gap:8px;padding:9px 14px;border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0;flex-wrap:wrap;}
    .ctrl-btn{display:flex;align-items:center;gap:5px;font-family:var(--font-m);font-size:12px;font-weight:500;padding:5px 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;transition:all .12s;white-space:nowrap;}
    .ctrl-btn:hover:not(:disabled){border-color:var(--border2);color:var(--text);}
    .ctrl-btn:disabled{opacity:.35;cursor:not-allowed;}
    .ctrl-btn.play{background:var(--green3);color:var(--green);border-color:var(--green2);}
    .ctrl-btn.pause{background:var(--red3);color:var(--red);border-color:var(--red2);}
    .zoom-hint{font-size:10px;color:var(--text3);}
    .speed-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:11px;color:var(--text3);}
    .speed-wrap input[type=range]{width:76px;accent-color:var(--green);-webkit-appearance:none;height:3px;background:var(--bg4);border-radius:3px;outline:none;cursor:pointer;}
    .speed-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--green);cursor:pointer;}

    .side-panel{width:270px;flex-shrink:0;display:flex;flex-direction:column;border-left:1px solid var(--border);background:var(--bg);overflow:hidden;}
    .panel-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
    .ptab{flex:1;font-family:var(--font-m);font-size:11px;font-weight:500;padding:10px 4px;text-align:center;cursor:pointer;color:var(--text3);border-bottom:2px solid transparent;transition:all .12s;}
    .ptab:hover{color:var(--text2);}
    .ptab.active{color:var(--green);border-bottom-color:var(--green);}
    .panel-body{flex:1;overflow-y:auto;padding:13px;}

    .order-form{display:flex;flex-direction:column;gap:10px;}
    .form-grp{display:flex;flex-direction:column;gap:4px;}
    .form-grp label{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;}
    .form-grp input,.form-grp select{font-family:var(--font-m);font-size:13px;padding:7px 9px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);color:var(--text);width:100%;outline:none;transition:border .12s;}
    .form-grp input:focus,.form-grp select:focus{border-color:var(--green2);}
    .form-row{display:flex;gap:8px;}
    .form-row .form-grp{flex:1;}
    .side-btns{display:flex;gap:8px;}
    .btn-buy{flex:1;padding:9px;border-radius:var(--r);border:none;background:var(--green);color:#000;font-family:var(--font-m);font-size:13px;font-weight:500;cursor:pointer;transition:opacity .12s;}
    .btn-buy:hover{opacity:.85;}
    .btn-sell{flex:1;padding:9px;border-radius:var(--r);border:none;background:var(--red);color:#fff;font-family:var(--font-m);font-size:13px;font-weight:500;cursor:pointer;transition:opacity .12s;}
    .btn-sell:hover{opacity:.85;}
    .open-pos-box{margin-top:6px;padding:10px;background:var(--bg3);border-radius:var(--r);border:1px solid var(--border);}
    .open-pos-row{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px;}
    .sq-btn{width:100%;margin-top:8px;padding:7px;border-radius:var(--r);border:1px solid var(--red2);background:var(--red3);color:var(--red);font-family:var(--font-m);font-size:12px;cursor:pointer;}
    .sq-btn:hover{background:var(--red2);}

    .pnl-box{background:var(--bg3);border-radius:var(--r);border:1px solid var(--border);padding:11px;margin-bottom:11px;}
    .pnl-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;}
    .pnl-label{color:var(--text3);}
    .pnl-val{font-weight:500;color:var(--text);}
    .pnl-val.up{color:var(--green);}
    .pnl-val.dn{color:var(--red);}
    .sec-title{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;}
    .j-list{display:flex;flex-direction:column;gap:6px;}
    .j-entry{border:1px solid var(--border);border-radius:var(--r);padding:8px 10px;font-size:11px;transition:border-color .12s;}
    .j-entry:hover{border-color:var(--border2);}
    .j-top{display:flex;justify-content:space-between;margin-bottom:3px;align-items:center;}
    .j-sym{font-family:var(--font-d);font-weight:600;font-size:12px;}
    .j-side{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;}
    .j-side.B{background:var(--green3);color:var(--green);border:1px solid var(--green2);}
    .j-side.S{background:var(--red3);color:var(--red);border:1px solid var(--red2);}
    .j-meta{color:var(--text3);line-height:1.7;}
    .j-pnl{font-weight:500;}
    .j-pnl.up{color:var(--green);}
    .j-pnl.dn{color:var(--red);}
    .j-pnl.open{color:var(--text3);}
    .no-trades{text-align:center;color:var(--text3);padding:22px 0;line-height:1.9;}
    .proxy-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:11px;margin-bottom:11px;line-height:1.8;}
    .proxy-box b{color:var(--text);}
    .code-block{margin-top:7px;font-family:var(--font-m);font-size:11px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);padding:7px 9px;color:var(--text3);line-height:2;}
    .proxy-row{display:flex;gap:6px;margin-top:7px;}
    .proxy-row input{flex:1;font-family:var(--font-m);font-size:12px;padding:5px 8px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg2);color:var(--text);outline:none;}
    .proxy-row button{font-family:var(--font-m);font-size:12px;font-weight:500;padding:5px 11px;border-radius:var(--r);border:none;background:var(--green);color:#000;cursor:pointer;}
    .proxy-status{font-size:11px;margin-top:5px;min-height:16px;}
    .reload-btn{width:100%;padding:8px;margin-top:8px;border-radius:var(--r);border:1px solid var(--border2);background:transparent;font-family:var(--font-m);font-size:12px;color:var(--text2);cursor:pointer;}
    .reload-btn:hover{background:var(--bg3);}
  </style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand">Trade<em>Replay</em></div>
    <div class="sep"></div>
    <select class="instr-sel" id="instrSel">
      <option value="NIFTY50">Nifty 50</option>
      <option value="BANKNIFTY">Bank Nifty</option>
      <option value="RELIANCE">RELIANCE</option>
      <option value="TCS">TCS</option>
      <option value="HDFCBANK">HDFC Bank</option>
      <option value="INFY">Infosys</option>
      <option value="SBIN">SBI</option>
      <option value="ICICIBANK">ICICI Bank</option>
      <option value="BAJFINANCE">Bajaj Finance</option>
      <option value="TATAMOTORS">Tata Motors</option>
    </select>
    <div class="tf-btns">
      <button class="tf-btn active" data-tf="1m">1m</button>
      <button class="tf-btn" data-tf="5m">5m</button>
      <button class="tf-btn" data-tf="15m">15m</button>
      <button class="tf-btn" data-tf="1h">1H</button>
    </div>
    <span class="badge badge-sim" id="dataBadge">Simulated</span>
    <span class="session-date" id="sessionDate">—</span>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>

  <div class="main">
    <div class="chart-area">
      <div class="price-header">
        <span class="price-symbol" id="hdrSym">NIFTY 50</span>
        <span class="price-ltp" id="hdrLtp">—</span>
        <span class="price-chg" id="hdrChg"></span>
      </div>
      <div class="ohlc">
        <span>O&nbsp;<b id="ohlcO">—</b></span>
        <span>H&nbsp;<b id="ohlcH">—</b></span>
        <span>L&nbsp;<b id="ohlcL">—</b></span>
        <span>C&nbsp;<b id="ohlcC">—</b></span>
        <span>Vol&nbsp;<b id="ohlcV">—</b></span>
      </div>
      <div class="candle-wrap" id="candleWrap">
        <canvas id="chartCanvas"></canvas>
        <div class="ch-tooltip" id="chTooltip"></div>
      </div>
      <div class="controls">
        <button class="ctrl-btn" id="btnReset"><i class="ti ti-refresh"></i> Reset</button>
        <button class="ctrl-btn" id="btnStep"><i class="ti ti-step-into"></i> Step</button>
        <button class="ctrl-btn play" id="btnPlay"><i class="ti ti-player-play"></i> Play</button>
        <button class="ctrl-btn" id="btnFit" title="Fit view · F"><i class="ti ti-arrows-maximize"></i> Fit</button>
        <span class="zoom-hint">scroll=zoom · drag=pan · F=fit</span>
        <div class="speed-wrap">
          Speed<input type="range" min="1" max="10" value="3" id="speedSlider"><span id="speedVal">3×</span>
        </div>
      </div>
    </div>
    <div class="side-panel">
      <div class="panel-tabs">
        <div class="ptab active" data-tab="order">Order</div>
        <div class="ptab" data-tab="position">P&amp;L</div>
        <div class="ptab" data-tab="journal">Journal</div>
        <div class="ptab" data-tab="data">Data</div>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </div>
</div>

<script>
// ── INSTRUMENTS
const INSTR={
  NIFTY50:   {label:'Nifty 50',     base:22000,vol:150,lot:50},
  BANKNIFTY: {label:'Bank Nifty',   base:48000,vol:400,lot:25},
  RELIANCE:  {label:'RELIANCE',     base:2900, vol:30, lot:250},
  TCS:       {label:'TCS',          base:3900, vol:40, lot:150},
  HDFCBANK:  {label:'HDFC Bank',    base:1650, vol:20, lot:550},
  INFY:      {label:'Infosys',      base:1450, vol:18, lot:600},
  SBIN:      {label:'SBI',          base:820,  vol:12, lot:1500},
  ICICIBANK: {label:'ICICI Bank',   base:1100, vol:15, lot:700},
  BAJFINANCE:{label:'Bajaj Finance',base:7200, vol:80, lot:125},
  TATAMOTORS:{label:'Tata Motors',  base:1050, vol:18, lot:950},
};

// ── APP STATE
let candles=[],idx=0,playing=false,timer=null;
let trades=[],openPos=null;
let sym='NIFTY50',tf='1m',tab='order';
let proxyUrl='http://localhost:3001',dataSource='simulated';

// ── VIEWPORT (zoom/pan)
let vStart=0,vEnd=80;        // visible candle range (float indices)
const V_MIN=5,V_MAX=300;

// ── INTERACTION STATE
let dragging=false,dragX0=0,dragVS0=0,dragVE0=0;
let mX=-1,mY=-1,mIn=false;

// ── LAYOUT
const PAD={t:14,b:32,l:0,r:80};

// ── CANDLE GENERATION
function sr(s){let x=Math.sin(s)*10000;return x-Math.floor(x);}
function genCandles(s,t){
  const ins=INSTR[s],tfm=t==='1m'?1:t==='5m'?5:t==='15m'?15:60;
  let p=ins.base,seed=s.charCodeAt(0)*17+tfm;
  const arr=[],now=new Date(2024,0,15,9,15,0);
  for(let i=0;i<300;i++){
    seed++;const r1=sr(seed);seed++;const r2=sr(seed);seed++;
    const r3=sr(seed);seed++;const r4=sr(seed);seed++;
    const chg=(r1-.48)*ins.vol*.5,o=p,c=o+chg;
    arr.push({open:o,high:Math.max(o,c)+r2*ins.vol*.3,low:Math.min(o,c)-r3*ins.vol*.3,close:c,vol:Math.floor(r4*5e5+1e5),ts:new Date(now.getTime()+i*tfm*6e4)});
    p=c;
  }
  return arr;
}

// ── REAL DATA
async function fetchReal(s,t){
  setBadge('loading','Fetching…');
  try{
    const r=await fetch(`${proxyUrl}/candles?symbol=${s}&tf=${t}`,{signal:AbortSignal.timeout(8e3)});
    if(!r.ok)throw 0;
    const d=await r.json();
    if(!d.candles||d.candles.length<5)throw 0;
    setBadge('live','Live NSE');dataSource='live';
    return d.candles.map(c=>({...c,ts:new Date(c.ts)}));
  }catch{setBadge('sim','Simulated');dataSource='simulated';return null;}
}
function setBadge(t,x){const b=document.getElementById('dataBadge');b.className='badge badge-'+t;b.textContent=x;}

// ── FORMAT
function fp(p){return Number(p).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});}
function ft(d){return new Date(d).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:false});}
function fd(d){return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}

// ── VIEWPORT HELPERS
function clamp(){
  const vis=idx+1;
  vStart=Math.max(0,vStart);
  vEnd=Math.min(vis,vEnd);
  if(vEnd-vStart<V_MIN){
    if(vStart===0)vEnd=Math.min(vis,V_MIN);
    else vStart=vEnd-V_MIN;
  }
  if(vEnd-vStart>V_MAX)vStart=vEnd-V_MAX;
}
function fitView(){vStart=Math.max(0,idx+1-80);vEnd=idx+1;}

// ── NICE AXIS STEP
function niceStep(range,n){
  const r=range/n,m=Math.pow(10,Math.floor(Math.log10(r))),f=r/m;
  return f<1.5?m:f<3.5?2*m:f<7.5?5*m:10*m;
}

// ── DRAW
function draw(){
  const canvas=document.getElementById('chartCanvas');
  const wrap=document.getElementById('candleWrap');
  const W=wrap.clientWidth,H=wrap.clientHeight;
  if(!W||!H)return;
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,W,H);

  const vis=candles.slice(0,idx+1);
  if(!vis.length)return;
  clamp();

  const s0=Math.max(0,Math.floor(vStart));
  const s1=Math.min(vis.length,Math.ceil(vEnd));
  const slice=vis.slice(s0,s1);
  if(!slice.length)return;

  const CW=W-PAD.l-PAD.r,CH=H-PAD.t-PAD.b;
  const prices=slice.flatMap(c=>[c.high,c.low]);
  let mn=Math.min(...prices),mx=Math.max(...prices);
  const rng=mx-mn||1;mn-=rng*.08;mx+=rng*.08;
  const PR=mx-mn;
  const toY=p=>PAD.t+CH*(1-(p-mn)/PR);
  const toP=y=>mn+(1-(y-PAD.t)/CH)*PR;

  const span=vEnd-vStart;
  const sp=CW/span;
  const cw=Math.max(1,sp*.72);

  // ── GRID
  const pStep=niceStep(PR,6);
  const pS=Math.ceil(mn/pStep)*pStep;
  for(let p=pS;p<mx;p+=pStep){
    const y=toY(p);
    ctx.strokeStyle='rgba(255,255,255,0.045)';ctx.lineWidth=.5;
    ctx.beginPath();ctx.moveTo(PAD.l,y);ctx.lineTo(W-PAD.r,y);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.28)';ctx.font='10px DM Mono,monospace';ctx.textAlign='left';
    ctx.fillText(fp(p),W-PAD.r+5,y+3.5);
  }
  const tStep=Math.max(1,Math.round(span/6));
  for(let i=0;i<slice.length;i+=tStep){
    const x=PAD.l+(i+.5-(vStart-s0))*sp;
    ctx.strokeStyle='rgba(255,255,255,0.035)';ctx.lineWidth=.5;
    ctx.beginPath();ctx.moveTo(x,PAD.t);ctx.lineTo(x,H-PAD.b);ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.2)';ctx.font='10px DM Mono,monospace';ctx.textAlign='center';
    ctx.fillText(ft(slice[i].ts),x,H-7);
  }

  // ── CANDLES
  slice.forEach((c,i)=>{
    const x=PAD.l+(i+.5-(vStart-s0))*sp;
    const up=c.close>=c.open,col=up?'#22c97a':'#f04f4f';
    ctx.strokeStyle=col;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,toY(c.high));ctx.lineTo(x,toY(c.low));ctx.stroke();
    ctx.fillStyle=col;
    ctx.fillRect(x-cw/2,Math.min(toY(c.open),toY(c.close)),cw,Math.max(Math.abs(toY(c.open)-toY(c.close)),1));
  });

  // ── LAST PRICE LABEL
  if(slice.length){
    const last=slice[slice.length-1];
    const ly=toY(last.close),col=last.close>=last.open?'#22c97a':'#f04f4f';
    ctx.strokeStyle=col.replace(')',',0.4)').replace('rgb','rgba');
    ctx.setLineDash([4,4]);ctx.lineWidth=.5;
    ctx.beginPath();ctx.moveTo(PAD.l,ly);ctx.lineTo(W-PAD.r,ly);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=col;
    ctx.fillRect(W-PAD.r+1,ly-9,PAD.r-2,18);
    ctx.fillStyle='#000';ctx.font='bold 10px DM Mono,monospace';ctx.textAlign='center';
    ctx.fillText(fp(last.close),W-PAD.r/2,ly+3.5);
  }

  // ── ENTRY LINE
  if(openPos){
    const ey=toY(openPos.price),ec=openPos.side==='BUY'?'#22c97a':'#f04f4f';
    ctx.strokeStyle=ec;ctx.lineWidth=1.5;ctx.setLineDash([7,4]);
    ctx.beginPath();ctx.moveTo(PAD.l,ey);ctx.lineTo(W-PAD.r,ey);ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle=ec;ctx.font='500 10px DM Mono,monospace';ctx.textAlign='right';
    ctx.fillText(openPos.side==='BUY'?'▲ Entry':'▼ Entry',W-PAD.r-4,ey-4);
  }

  // ── CROSSHAIR
  if(mIn&&mX>=PAD.l&&mX<=W-PAD.r&&mY>=PAD.t&&mY<=H-PAD.b){
    ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=.5;ctx.setLineDash([]);
    ctx.beginPath();ctx.moveTo(mX,PAD.t);ctx.lineTo(mX,H-PAD.b);ctx.stroke();
    ctx.beginPath();ctx.moveTo(PAD.l,mY);ctx.lineTo(W-PAD.r,mY);ctx.stroke();

    // Price label Y
    const hp=toP(mY);
    ctx.fillStyle='rgba(255,255,255,0.12)';
    ctx.fillRect(W-PAD.r+1,mY-9,PAD.r-2,18);
    ctx.fillStyle='rgba(255,255,255,0.65)';ctx.font='10px DM Mono,monospace';ctx.textAlign='center';
    ctx.fillText(fp(hp),W-PAD.r/2,mY+3.5);

    // Candle tooltip
    const hi=Math.round((mX-PAD.l)/sp-(0.5-(vStart-s0)))+s0;
    if(hi>=0&&hi<vis.length){
      const tc=vis[hi];
      // Time label X
      ctx.fillStyle='rgba(255,255,255,0.12)';
      ctx.fillRect(mX-34,H-PAD.b,68,18);
      ctx.fillStyle='rgba(255,255,255,0.65)';ctx.textAlign='center';
      ctx.fillText(ft(tc.ts),mX,H-PAD.b+12);

      const tip=document.getElementById('chTooltip');
      tip.style.display='block';
      tip.innerHTML=`<b>${ft(tc.ts)}</b>&nbsp; O&nbsp;<b>${fp(tc.open)}</b>&nbsp; H&nbsp;<b>${fp(tc.high)}</b>&nbsp; L&nbsp;<b>${fp(tc.low)}</b>&nbsp; C&nbsp;<b style="color:${tc.close>=tc.open?'#22c97a':'#f04f4f'}">${fp(tc.close)}</b>&nbsp; Vol&nbsp;<b>${(tc.vol/1000).toFixed(0)}K</b>`;
      let tx=mX+16,ty=mY-46;
      if(tx+280>W)tx=mX-286;if(ty<4)ty=mY+12;
      tip.style.left=tx+'px';tip.style.top=ty+'px';
    }
  } else {
    document.getElementById('chTooltip').style.display='none';
  }
}

// ── INTERACTION
function setupInteraction(){
  const wrap=document.getElementById('candleWrap');

  // Scroll = horizontal zoom centred on cursor
  wrap.addEventListener('wheel',e=>{
    e.preventDefault();
    const rect=wrap.getBoundingClientRect();
    const canvas=document.getElementById('chartCanvas');
    const mx=e.clientX-rect.left;
    const CW=canvas.width-PAD.l-PAD.r;
    const frac=Math.max(0,Math.min(1,(mx-PAD.l)/CW));
    const span=vEnd-vStart;
    const zf=e.deltaY>0?1.18:.84;
    const ns=Math.max(V_MIN,Math.min(V_MAX,span*zf));
    const pivot=vStart+frac*span;
    vStart=pivot-frac*ns;vEnd=pivot+(1-frac)*ns;
    clamp();draw();
  },{passive:false});

  // Mouse drag = pan
  wrap.addEventListener('mousedown',e=>{
    if(e.button!==0)return;
    dragging=true;dragX0=e.clientX;dragVS0=vStart;dragVE0=vEnd;
    wrap.style.cursor='grabbing';
  });
  window.addEventListener('mousemove',e=>{
    const rect=wrap.getBoundingClientRect();
    mX=e.clientX-rect.left;mY=e.clientY-rect.top;
    mIn=mX>=0&&mX<=rect.width&&mY>=0&&mY<=rect.height;
    if(dragging){
      const canvas=document.getElementById('chartCanvas');
      const CW=canvas.width-PAD.l-PAD.r;
      const span=dragVE0-dragVS0;
      const dx=e.clientX-dragX0;
      const dc=dx/CW*span;
      vStart=dragVS0-dc;vEnd=dragVE0-dc;
      clamp();
    }
    draw();
  });
  window.addEventListener('mouseup',()=>{dragging=false;wrap.style.cursor='crosshair';});
  wrap.addEventListener('mouseleave',()=>{mIn=false;draw();});

  // Touch: single-finger pan, two-finger pinch-zoom
  let lt=null;
  wrap.addEventListener('touchstart',e=>{lt=Array.from(e.touches);},{passive:true});
  wrap.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(!lt)return;
    const canvas=document.getElementById('chartCanvas');
    const CW=canvas.width-PAD.l-PAD.r;
    const span=vEnd-vStart;
    if(e.touches.length===1&&lt.length===1){
      const dx=e.touches[0].clientX-lt[0].clientX;
      vStart-=dx/CW*span;vEnd-=dx/CW*span;clamp();
    } else if(e.touches.length===2&&lt.length===2){
      const d0=Math.abs(lt[0].clientX-lt[1].clientX)||1;
      const d1=Math.abs(e.touches[0].clientX-e.touches[1].clientX);
      const sc=d0/d1;
      const midX=((e.touches[0].clientX+e.touches[1].clientX)/2)-wrap.getBoundingClientRect().left;
      const frac=Math.max(0,Math.min(1,(midX-PAD.l)/CW));
      const ns=Math.max(V_MIN,Math.min(V_MAX,span*sc));
      const pivot=vStart+frac*span;
      vStart=pivot-frac*ns;vEnd=pivot+(1-frac)*ns;clamp();
    }
    lt=Array.from(e.touches);draw();
  },{passive:false});
  wrap.addEventListener('touchend',e=>{lt=Array.from(e.touches);});

  // Keyboard
  document.addEventListener('keydown',e=>{
    if(e.key==='f'||e.key==='F'){fitView();draw();}
    if(e.key==='+'||e.key==='='){zoom(.75);}
    if(e.key==='-'){zoom(1.33);}
    if((e.key==='ArrowRight'||e.key==='.')&&!playing)stepFwd();
  });
}
function zoom(f){
  const c=(vStart+vEnd)/2,ns=Math.max(V_MIN,Math.min(V_MAX,(vEnd-vStart)*f));
  vStart=c-ns/2;vEnd=c+ns/2;clamp();draw();
}

// ── HEADER
function updateHeader(){
  if(!candles[idx])return;
  const c=candles[idx],first=candles[0].open,chg=c.close-first,pct=chg/first*100;
  document.getElementById('hdrSym').textContent=INSTR[sym].label;
  document.getElementById('hdrLtp').textContent='₹'+fp(c.close);
  const el=document.getElementById('hdrChg');
  el.textContent=(chg>=0?'+':'')+fp(chg)+' ('+(chg>=0?'+':'')+pct.toFixed(2)+'%)';
  el.className='price-chg '+(chg>=0?'up':'dn');
  document.getElementById('ohlcO').textContent=fp(c.open);
  document.getElementById('ohlcH').textContent=fp(c.high);
  document.getElementById('ohlcL').textContent=fp(c.low);
  document.getElementById('ohlcC').textContent=fp(c.close);
  document.getElementById('ohlcV').textContent=(c.vol/1e3).toFixed(0)+'K';
  if(candles.length>1)document.getElementById('sessionDate').textContent=fd(candles[0].ts)+' — '+fd(candles[candles.length-1].ts);
  document.getElementById('progFill').style.width=((idx/(candles.length-1))*100).toFixed(1)+'%';
}

function calcPnl(){
  if(!openPos||!candles[idx])return null;
  const d=openPos.side==='BUY'?candles[idx].close-openPos.price:openPos.price-candles[idx].close;
  return d*openPos.qty;
}

// ── PANEL
function renderPanel(){
  const body=document.getElementById('panelBody');
  const c=candles[idx]||{},ltp=c.close||0,ins=INSTR[sym];
  if(tab==='order'){
    body.innerHTML=`<div class="order-form">
      <div class="form-grp"><label>Order type</label>
        <select id="oType"><option>Market</option><option>Limit</option></select></div>
      <div class="form-row">
        <div class="form-grp"><label>Price ₹</label><input type="number" id="oPrice" value="${ltp.toFixed(2)}" step="0.05"></div>
        <div class="form-grp"><label>Lots</label><input type="number" id="oQty" value="1" min="1"></div>
      </div>
      <div class="form-row">
        <div class="form-grp"><label>Stop Loss ₹</label><input type="number" id="oSl" placeholder="—" step="0.05"></div>
        <div class="form-grp"><label>Target ₹</label><input type="number" id="oTgt" placeholder="—" step="0.05"></div>
      </div>
      <div style="font-size:10px;color:var(--text3);">Lot size: ${ins.lot} shares</div>
      <div class="side-btns">
        <button class="btn-buy" onclick="placeOrder('BUY')">▲ Buy</button>
        <button class="btn-sell" onclick="placeOrder('SELL')">▼ Sell</button>
      </div>
      ${openPos?`<div class="open-pos-box">
        <div class="open-pos-row"><span style="color:var(--text3)">Open ${openPos.side}</span><span style="color:${openPos.side==='BUY'?'var(--green)':'var(--red)'}">${openPos.qty}q @ ₹${fp(openPos.price)}</span></div>
        <div class="open-pos-row"><span style="color:var(--text3)">MTM P&L</span><span style="color:${(calcPnl()||0)>=0?'var(--green)':'var(--red)'}">${(calcPnl()||0)>=0?'+':''}₹${fp(calcPnl()||0)}</span></div>
        <button class="sq-btn" onclick="squareOff()">✕ Square Off</button>
      </div>`:''}
    </div>`;
  } else if(tab==='position'){
    const tot=trades.reduce((s,t)=>s+(t.pnl||0),0);
    const cl=trades.filter(t=>t.exitPrice),wi=cl.filter(t=>(t.pnl||0)>0);
    body.innerHTML=`<div class="pnl-box">
      <div class="pnl-row"><span class="pnl-label">Realised P&L</span><span class="pnl-val ${tot>=0?'up':'dn'}">${tot>=0?'+':''}₹${fp(tot)}</span></div>
      <div class="pnl-row"><span class="pnl-label">Trades</span><span class="pnl-val">${cl.length}</span></div>
      <div class="pnl-row"><span class="pnl-label">Win rate</span><span class="pnl-val">${cl.length?Math.round(wi.length/cl.length*100):0}%</span></div>
      <div class="pnl-row"><span class="pnl-label">Avg win</span><span class="pnl-val up">${wi.length?'₹'+fp(wi.reduce((s,t)=>s+t.pnl,0)/wi.length):'—'}</span></div>
      ${openPos?`<div class="pnl-row"><span class="pnl-label">Open MTM</span><span class="pnl-val ${(calcPnl()||0)>=0?'up':'dn'}">${(calcPnl()||0)>=0?'+':''}₹${fp(calcPnl()||0)}</span></div>`:''}
    </div>
    <div class="sec-title">Closed trades</div>
    <div class="j-list">${!cl.length?'<div class="no-trades">No closed trades yet.</div>':
      [...cl].reverse().map(t=>`<div class="j-entry">
        <div class="j-top"><span class="j-sym">${t.symbol}</span><span class="j-side ${t.side[0]}">${t.side}</span></div>
        <div class="j-meta">₹${fp(t.entryPrice)} → ₹${fp(t.exitPrice)}</div>
        <div style="display:flex;justify-content:space-between;margin-top:2px;"><span class="j-meta">${ft(t.entryTime)}→${ft(t.exitTime)}</span><span class="j-pnl ${(t.pnl||0)>=0?'up':'dn'}">${(t.pnl||0)>=0?'+':''}₹${fp(t.pnl||0)}</span></div>
      </div>`).join('')}
    </div>`;
  } else if(tab==='journal'){
    body.innerHTML=`<div class="sec-title">All trades</div>
    <div class="j-list">${!trades.length?'<div class="no-trades">No trades yet.</div>':
      [...trades].reverse().map(t=>`<div class="j-entry">
        <div class="j-top"><span class="j-sym">${t.symbol} <span style="font-weight:400;color:var(--text3);font-size:10px;">${t.tf}</span></span><span class="j-side ${t.side[0]}">${t.side}</span></div>
        <div class="j-meta">${ft(t.entryTime)} · ${t.qty}q · ₹${fp(t.entryPrice)}</div>
        ${t.exitPrice
          ?`<div style="display:flex;justify-content:space-between;margin-top:3px;"><span class="j-meta">Exit ₹${fp(t.exitPrice)}</span><span class="j-pnl ${(t.pnl||0)>=0?'up':'dn'}">${(t.pnl||0)>=0?'+':''}₹${fp(t.pnl||0)}</span></div>`
          :`<div style="margin-top:3px;"><span class="j-pnl open">Open · MTM ₹${fp(calcPnl()||0)}</span></div>`}
        ${t.sl?`<div class="j-meta">SL ₹${fp(t.sl)} · TP ${t.tgt?'₹'+fp(t.tgt):'—'}</div>`:''}
      </div>`).join('')}
    </div>`;
  } else {
    body.innerHTML=`<div class="proxy-box">
      <b>Real NSE data</b><br><span style="color:var(--text3)">Run the proxy locally:</span>
      <div class="code-block">cd tradereplay-proxy<br>npm install<br>node server.js</div>
    </div>
    <div class="form-grp" style="margin-bottom:10px;"><label>Proxy URL</label>
      <div class="proxy-row">
        <input type="text" id="proxyIn" value="${proxyUrl}" placeholder="http://localhost:3001">
        <button onclick="testProxy()">Connect</button>
      </div>
      <div class="proxy-status" id="proxyStatus"></div>
    </div>
    <div class="form-grp" style="margin-bottom:10px;"><label>Source</label>
      <select id="dataSrc" style="font-family:var(--font-m);font-size:13px;padding:7px 9px;border-radius:var(--r);border:1px solid var(--border);background:var(--bg3);color:var(--text);outline:none;">
        <option value="auto">Auto (live if available)</option>
        <option value="simulated"${dataSource==='simulated'?' selected':''}>Simulated only</option>
      </select>
    </div>
    <button class="reload-btn" onclick="resetSession()">↺ Reload data</button>`;
  }
}

// ── TRADING
function placeOrder(side){
  if(!candles[idx])return;
  const c=candles[idx],qty=parseInt(document.getElementById('oQty')?.value||1);
  const sl=parseFloat(document.getElementById('oSl')?.value||0)||null;
  const tgt=parseFloat(document.getElementById('oTgt')?.value||0)||null;
  const totalQty=qty*INSTR[sym].lot;
  if(openPos){
    if((openPos.side==='BUY'&&side==='SELL')||(openPos.side==='SELL'&&side==='BUY')){squareOff();return;}
    alert('Square off existing position first.');return;
  }
  openPos={side,price:c.close,qty:totalQty,sl,tgt};
  trades.push({symbol:sym,tf,side,entryPrice:c.close,entryTime:c.ts,qty:totalQty,sl,tgt,exitPrice:null,exitTime:null,pnl:null});
  renderPanel();draw();
}
function squareOff(){
  if(!openPos||!candles[idx])return;
  const ltp=candles[idx].close,d=openPos.side==='BUY'?ltp-openPos.price:openPos.price-ltp,pnl=d*openPos.qty;
  const t=trades[trades.length-1];
  if(t&&!t.exitPrice){t.exitPrice=ltp;t.exitTime=candles[idx].ts;t.pnl=pnl;}
  openPos=null;renderPanel();draw();
}
function checkSlTgt(){
  if(!openPos||!candles[idx])return;
  const c=candles[idx];
  if(openPos.sl){
    if(openPos.side==='BUY'&&c.low<=openPos.sl){openPos.price=openPos.sl;squareOff();return;}
    if(openPos.side==='SELL'&&c.high>=openPos.sl){openPos.price=openPos.sl;squareOff();return;}
  }
  if(openPos.tgt){
    if(openPos.side==='BUY'&&c.high>=openPos.tgt){openPos.price=openPos.tgt;squareOff();return;}
    if(openPos.side==='SELL'&&c.low<=openPos.tgt){openPos.price=openPos.tgt;squareOff();return;}
  }
}

// ── REPLAY
function stepFwd(){
  if(idx<candles.length-1){
    idx++;
    if(idx>=vEnd-1){vStart++;vEnd++;}  // auto-scroll
    checkSlTgt();updateHeader();draw();renderPanel();return true;
  }
  stopPlay();return false;
}
function startPlay(){
  if(playing)return;playing=true;
  document.getElementById('btnPlay').innerHTML='<i class="ti ti-player-pause"></i> Pause';
  document.getElementById('btnPlay').className='ctrl-btn pause';
  const sp=parseInt(document.getElementById('speedSlider').value);
  timer=setInterval(stepFwd,Math.max(50,600-sp*55));
}
function stopPlay(){
  playing=false;if(timer){clearInterval(timer);timer=null;}
  document.getElementById('btnPlay').innerHTML='<i class="ti ti-player-play"></i> Play';
  document.getElementById('btnPlay').className='ctrl-btn play';
}

async function testProxy(){
  const inp=document.getElementById('proxyIn');
  proxyUrl=inp.value.trim().replace(/\/$/,'');
  const st=document.getElementById('proxyStatus');
  st.style.color='var(--amber)';st.textContent='Connecting…';
  try{
    await fetch(proxyUrl+'/',{signal:AbortSignal.timeout(4e3)});
    st.style.color='var(--green)';st.textContent='✓ Proxy connected';setBadge('live','Live NSE');
  }catch{st.style.color='var(--red)';st.textContent='✗ Proxy not reachable';}
}

async function resetSession(){
  stopPlay();openPos=null;idx=0;
  const force=document.getElementById('dataSrc')?.value==='simulated';
  if(!force){
    const real=await fetchReal(sym,tf);
    candles=real&&real.length>5?real:genCandles(sym,tf);
    if(!real||real.length<=5)setBadge('sim','Simulated');
  }else{candles=genCandles(sym,tf);setBadge('sim','Simulated');}
  fitView();updateHeader();draw();renderPanel();
}

// ── BOOT
document.getElementById('btnPlay').addEventListener('click',()=>playing?stopPlay():startPlay());
document.getElementById('btnStep').addEventListener('click',stepFwd);
document.getElementById('btnReset').addEventListener('click',resetSession);
document.getElementById('btnFit').addEventListener('click',()=>{fitView();draw();});
document.getElementById('speedSlider').addEventListener('input',function(){
  document.getElementById('speedVal').textContent=this.value+'×';
  if(playing){stopPlay();startPlay();}
});
document.getElementById('instrSel').addEventListener('change',function(){sym=this.value;resetSession();});
document.querySelectorAll('.tf-btn').forEach(b=>b.addEventListener('click',function(){
  document.querySelectorAll('.tf-btn').forEach(x=>x.classList.remove('active'));
  this.classList.add('active');tf=this.dataset.tf;resetSession();
}));
document.querySelectorAll('.ptab').forEach(b=>b.addEventListener('click',function(){
  document.querySelectorAll('.ptab').forEach(x=>x.classList.remove('active'));
  this.classList.add('active');tab=this.dataset.tab;renderPanel();
}));
window.addEventListener('resize',draw);

setupInteraction();
resetSession();
</script>
</body>
</html>
